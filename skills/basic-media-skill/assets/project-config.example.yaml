# basic-media-skill — example project configuration (safe defaults)
# Copy, edit, and point the pipeline at it. Defaults are conservative:
# no mass download, dry-run only until you explicitly confirm.

TARGET_URL: "https://example.org/gallery/"
PROJECT_NAME: "example_gallery_archive"
OUTPUT_DIR: "./example_gallery_archive"

SCOPE: "gallery"
ALLOWED_DOMAINS:
  - "example.org"

INCLUDE_FILE_TYPES:
  - jpg
  - jpeg
  - png
  - gif
  - webp
  - tif
  - tiff
  - pdf
  - djvu

DOWNLOAD_ORIGINALS: true
DOWNLOAD_ATTACHMENTS: true
SAVE_RAW_HTML: true
SAVE_WARC: false
OCR_ENABLED: false
VISUAL_INDEX_ENABLED: false
SEMANTIC_INDEX_ENABLED: false

RESPECT_ROBOTS_TXT: true
REQUEST_DELAY_SECONDS: 2
MAX_CONCURRENT_REQUESTS_PER_DOMAIN: 1
MAX_PAGES: 20
MAX_DEPTH: 3
RETRY_STATUS_CODES: [408, 429, 500, 502, 503, 504]

# Recovery is mandatory for missing/corrupt media, but the archive is complete
# only after the Wayback recovery queue is processed.
WAYBACK_ENABLED: true

USER_AGENT_CONTACT: "archive@example.org"
ARCHIVE_PURPOSE: "Personal research archiving of publicly available material; republication is out of scope."
USER_CONFIRMED_FULL_RUN: false